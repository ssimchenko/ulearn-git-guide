<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Repository branches and tags</title>
  <desc id="desc">Terminal-style overview of nine course branches and eight milestone tags in the repository.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace; }
      .text { fill: #c9d1d9; font-size: 20px; }
      .muted { fill: #8b949e; }
      .cyan { fill: #79c0ff; }
      .green { fill: #7ee787; }
      .orange { fill: #ffa657; }
      .purple { fill: #d2a8ff; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="24" fill="#f6f8fa"/>
  <rect x="42" y="38" width="1316" height="640" rx="18" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="42" y="38" width="1316" height="56" rx="18" fill="#21262d"/>
  <rect x="42" y="76" width="1316" height="18" fill="#21262d"/>
  <circle cx="78" cy="66" r="8" fill="#ff7b72"/>
  <circle cx="106" cy="66" r="8" fill="#d29922"/>
  <circle cx="134" cy="66" r="8" fill="#3fb950"/>
  <text x="700" y="72" text-anchor="middle" class="mono muted" font-size="16">ulearn-git-guide — refs</text>

  <text x="78" y="134" class="mono" font-size="18"><tspan class="green">alexander@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~/ulearn-git-guide</tspan><tspan class="muted">$</tspan><tspan class="text"> git branch --all</tspan></text>
  <text x="742" y="134" class="mono" font-size="18"><tspan class="green">alexander@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~/ulearn-git-guide</tspan><tspan class="muted">$</tspan><tspan class="text"> git tag --list</tspan></text>

  <line x1="700" y1="116" x2="700" y2="630" stroke="#30363d" stroke-width="2"/>

  <g class="mono text">
    <text x="90" y="186"><tspan class="muted">  </tspan><tspan>guide-feature</tspan></text>
    <text x="90" y="226"><tspan class="green">* </tspan><tspan class="green">main</tspan></text>
    <text x="90" y="266"><tspan class="muted">  </tspan><tspan>merge-feature</tspan></text>
    <text x="90" y="306"><tspan class="muted">  </tspan><tspan>picking-feature</tspan></text>
    <text x="90" y="346"><tspan class="muted">  </tspan><tspan>quotation-feature</tspan></text>
    <text x="90" y="386"><tspan class="muted">  </tspan><tspan>rerefs-feature</tspan></text>
    <text x="90" y="426"><tspan class="muted">  </tspan><tspan>review</tspan></text>
    <text x="90" y="466"><tspan class="muted">  </tspan><tspan>tracking-feature</tspan></text>
    <text x="90" y="506"><tspan class="muted">  </tspan><tspan>undoing-feature</tspan></text>

    <text x="760" y="186" class="orange">runner</text>
    <text x="760" y="226" class="purple">v0.1</text>
    <text x="760" y="266" class="purple">v0.2</text>
    <text x="760" y="306" class="purple">v0.3</text>
    <text x="760" y="346" class="purple">v0.4</text>
    <text x="760" y="386" class="purple">v0.5</text>
    <text x="760" y="426" class="purple">v0.6</text>
    <text x="760" y="466" class="green">v1.0</text>
  </g>

  <rect x="82" y="550" width="568" height="78" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="110" y="583" class="mono cyan" font-size="19">9 course branches</text>
  <text x="110" y="610" class="mono muted" font-size="15">feature work • merge practice • review • tracking</text>

  <rect x="742" y="550" width="568" height="78" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="770" y="583" class="mono purple" font-size="19">8 milestone tags</text>
  <text x="770" y="610" class="mono muted" font-size="15">course checkpoints from v0.1 through v1.0</text>
</svg>
