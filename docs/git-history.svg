<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Git history graph</title>
  <desc id="desc">A terminal-style view of the repository history showing feature branches, merge commits, tags, a revert, and the review branch.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace; }
      .line { font-size: 18px; fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .cyan { fill: #79c0ff; }
      .green { fill: #7ee787; }
      .orange { fill: #ffa657; }
      .pink { fill: #ff7b72; }
      .purple { fill: #d2a8ff; }
    </style>
  </defs>

  <rect width="1400" height="930" rx="24" fill="#f6f8fa"/>
  <rect x="42" y="38" width="1316" height="850" rx="18" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="42" y="38" width="1316" height="56" rx="18" fill="#21262d"/>
  <rect x="42" y="76" width="1316" height="18" fill="#21262d"/>
  <circle cx="78" cy="66" r="8" fill="#ff7b72"/>
  <circle cx="106" cy="66" r="8" fill="#d29922"/>
  <circle cx="134" cy="66" r="8" fill="#3fb950"/>
  <text x="700" y="72" text-anchor="middle" class="mono muted" font-size="16">ulearn-git-guide — commit graph</text>

  <text x="78" y="132" class="mono" font-size="18"><tspan class="green">alexander@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~/ulearn-git-guide</tspan><tspan class="muted">$</tspan><tspan class="line"> git log --graph --all --decorate --oneline</tspan></text>

  <g class="mono line">
    <text x="78" y="176"><tspan class="pink">*</tspan><tspan x="110" class="orange">7e74a29</tspan><tspan x="210">(HEAD → main, origin/main)</tspan><tspan x="605">docs: describe Git coursework</tspan></text>
    <text x="78" y="204"><tspan class="pink">*</tspan><tspan x="110" class="orange">1328308</tspan><tspan x="210" class="green">(tag: v1.0)</tspan><tspan x="605">Merge branch 'tracking-feature'</tspan></text>
    <text x="78" y="232"><tspan class="cyan">|\</tspan></text>
    <text x="78" y="260"><tspan class="cyan">| *</tspan><tspan x="110" class="orange">5e1e75b</tspan><tspan x="210" class="purple">(tracking-feature)</tspan><tspan x="605">Add r3.md</tspan></text>
    <text x="78" y="288"><tspan class="cyan">|/</tspan></text>
    <text x="78" y="316"><tspan class="pink">*</tspan><tspan x="110" class="orange">bb29ab1</tspan><tspan x="210" class="green">(tag: v0.6)</tspan><tspan x="605">Hotfix. Add r2.md</tspan></text>
    <text x="78" y="344"><tspan class="pink">*</tspan><tspan x="110" class="orange">b6312cf</tspan><tspan x="210" class="green">(tag: v0.5)</tspan><tspan x="605">Add runner</tspan></text>
    <text x="78" y="372"><tspan class="pink">*</tspan><tspan x="110" class="orange">02c9bbf</tspan><tspan x="210" class="purple">(guide-feature)</tspan><tspan x="605">Add guide extensions</tspan></text>
    <text x="78" y="400"><tspan class="pink">*</tspan><tspan x="110" class="orange">f8b2996</tspan><tspan x="210" class="green">(tag: v0.4)</tspan><tspan x="605">Add stash command to a3.md</tspan></text>
    <text x="78" y="428"><tspan class="pink">*</tspan><tspan x="110" class="orange">abd19e7</tspan><tspan x="605">Add cherry-pick command to a3.md</tspan></text>
    <text x="78" y="456"><tspan class="pink">*</tspan><tspan x="110" class="orange">355e6f5</tspan><tspan x="210" class="green">(tag: v0.3)</tspan><tspan x="605">Merge branch 'undoing-feature'</tspan></text>
    <text x="78" y="484"><tspan class="cyan">|\</tspan></text>
    <text x="78" y="512"><tspan class="cyan">| *</tspan><tspan x="110" class="orange">91eaa8e</tspan><tspan x="210" class="purple">(undoing-feature)</tspan><tspan x="605">Add a2.md</tspan></text>
    <text x="78" y="540"><tspan class="pink">* |</tspan><tspan x="110" class="orange">f0e7156</tspan><tspan x="605">Revert &quot;Hotfix. Change a1.md&quot;</tspan></text>
    <text x="78" y="568"><tspan class="cyan">|/</tspan></text>
    <text x="78" y="596"><tspan class="pink">*</tspan><tspan x="110" class="orange">9c8e6a3</tspan><tspan x="605">Merge branch 'rerefs-feature'</tspan></text>
    <text x="78" y="624"><tspan class="cyan">|\</tspan></text>
    <text x="78" y="652"><tspan class="cyan">| | *</tspan><tspan x="140" class="orange">471ab34</tspan><tspan x="240" class="purple">(review)</tspan><tspan x="605">Review from v0.1 to v0.3</tspan></text>
    <text x="78" y="680"><tspan class="cyan">| * |</tspan><tspan x="140" class="orange">2af96aa</tspan><tspan x="240" class="purple">(rerefs-feature)</tspan><tspan x="605">Add s3.md</tspan></text>
    <text x="78" y="708"><tspan class="pink">* |</tspan><tspan x="110" class="orange">d05019b</tspan><tspan x="210" class="purple">(merge-feature)</tspan><tspan x="605">Add a1.md</tspan></text>
    <text x="78" y="736"><tspan class="pink">*</tspan><tspan x="110" class="orange">8b71580</tspan><tspan x="605">Merge branch 'quotation-feature'</tspan></text>
    <text x="78" y="764"><tspan class="cyan">|\</tspan></text>
    <text x="78" y="792"><tspan class="cyan">| *</tspan><tspan x="110" class="orange">f9e93f6</tspan><tspan x="210" class="purple">(quotation-feature)</tspan><tspan x="605">Replace with quotation</tspan></text>
    <text x="78" y="820"><tspan class="pink">*</tspan><tspan x="110" class="orange">e773b9c</tspan><tspan x="210" class="green">(tag: v0.1)</tspan><tspan x="605">Remove unfinished c1.md</tspan></text>
  </g>

  <text x="78" y="862" class="mono muted" font-size="15">Real refs and commits from the repository • merge history preserved</text>
</svg>
